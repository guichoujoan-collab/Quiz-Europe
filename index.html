<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EUROPA — Quiz Européen</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root {
    --blue: #061942;
    --blue2: #092b68;
    --blue3: #12458d;
    --gold: #ffd447;
    --gold-light: #ffed8a;
    --white: #f4f8ff;
    --muted: #8da4c7;
    --green: #52e89a;
    --red: #ff334d;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% -10%, #174995 0%, transparent 42%),
        linear-gradient(145deg, #02091b, #061b43 55%, #020817);
    color: var(--white);
    font-family: Inter, sans-serif;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(100,160,230,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,160,230,.035) 1px, transparent 1px);
    background-size: 45px 45px;
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,212,71,.045);
    filter: blur(70px);
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.stars {
    position: fixed;
    width: 150px;
    height: 150px;
    right: 5px;
    top: 10px;
    opacity: .12;
}

.stars span {
    position: absolute;
    color: var(--gold);
    font-size: 12px;
}

.stars span:nth-child(1) { left: 65px; top: 0; }
.stars span:nth-child(2) { left: 95px; top: 8px; }
.stars span:nth-child(3) { left: 118px; top: 30px; }
.stars span:nth-child(4) { left: 128px; top: 60px; }
.stars span:nth-child(5) { left: 118px; top: 90px; }
.stars span:nth-child(6) { left: 95px; top: 112px; }
.stars span:nth-child(7) { left: 65px; top: 120px; }
.stars span:nth-child(8) { left: 35px; top: 112px; }
.stars span:nth-child(9) { left: 12px; top: 90px; }
.stars span:nth-child(10) { left: 2px; top: 60px; }
.stars span:nth-child(11) { left: 12px; top: 30px; }
.stars span:nth-child(12) { left: 35px; top: 8px; }

.app {
    position: relative;
    width: min(680px, 94vw);
    margin: 20px auto;
    min-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
}

.header {
    padding: 24px 18px 20px;
    border-bottom: 1px solid rgba(150,190,240,.16);
    display: flex;
    align-items: center;
    gap: 14px;
}

.eu-logo {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border: 1px solid rgba(255,212,71,.65);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 24px;
    box-shadow: 0 0 20px rgba(255,212,71,.1);
}

.header h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: 2px;
}

.header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-family: "JetBrains Mono";
    font-size: 8px;
    letter-spacing: 1.5px;
}

.intro {
    padding: 28px 18px 15px;
}

.badge {
    display: inline-block;
    color: var(--gold);
    border: 1px solid rgba(255,212,71,.3);
    padding: 7px 10px;
    font-family: "JetBrains Mono";
    font-size: 8px;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
}

.intro h2 {
    margin: 0;
    font-size: clamp(25px, 7vw, 38px);
    line-height: 1.1;
}

.intro h2 span {
    color: var(--gold);
}

.intro-text {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    margin-top: 13px;
}

.progress-area {
    padding: 10px 18px 25px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    font-family: "JetBrains Mono";
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 8px;
}

.progress-top strong {
    color: var(--gold);
}

.progress {
    height: 5px;
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #fff0a0);
    box-shadow: 0 0 12px rgba(255,212,71,.4);
    transition: width .4s ease;
}

.quiz-card {
    margin: 0 0 25px;
    padding: 24px 18px;
    border: 1px solid rgba(120,170,230,.2);
    background:
        linear-gradient(145deg, rgba(11,40,88,.72), rgba(3,14,34,.82));
    box-shadow:
        0 20px 60px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.035);
}

.category {
    color: var(--gold);
    font-family: "JetBrains Mono";
    font-size: 8px;
    letter-spacing: 2px;
    margin-bottom: 17px;
}

.question {
    font-size: clamp(20px, 5.5vw, 29px);
    line-height: 1.35;
    font-weight: 700;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.answer {
    min-height: 70px;
    border: 1px solid rgba(130,175,230,.28);
    background: rgba(255,255,255,.025);
    color: white;
    font-family: "JetBrains Mono";
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

.answer:hover,
.answer:active {
    transform: translateY(-2px);
}

.answer.true:hover {
    border-color: var(--green);
    background: rgba(82,232,154,.08);
}

.answer.false:hover {
    border-color: var(--red);
    background: rgba(255,86,101,.08);
}

.answer.correct {
    border-color: var(--green);
    background: rgba(82,232,154,.12);
    color: var(--green);
}

.answer.wrong {
    border-color: var(--red);
    background: rgba(255,86,101,.12);
    color: var(--red);
}

.answer:disabled {
    cursor: default;
}

.explanation {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-left: 2px solid var(--gold);
    background: rgba(255,212,71,.035);
    color: #a7bad6;
    font-size: 11px;
    line-height: 1.7;
}

.explanation strong {
    color: var(--gold-light);
}

.nex
