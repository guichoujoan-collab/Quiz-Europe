```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUROPA — Quiz Européen</title>

<style>
/* =========================
   VARIABLES
========================= */
:root {
    --blue: #061b3a;
    --blue2: #0b2d5c;
    --gold: #ffd700;
    --red: #ff334d;
    --white: #f5f7fa;
    --green: #21d07a;
}

/* =========================
   BASE
========================= */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #12386d 0%, var(--blue) 45%, #020b18 100%);
    color: var(--white);
    font-family: "Inter", Arial, sans-serif;
}

/* =========================
   CONTENEUR
========================= */
.container {
    width: min(900px, 92%);
    margin: auto;
    padding: 40px 0;
}

/* =========================
   HEADER
========================= */
header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    display: inline-block;
    color: var(--gold);
    font-family: "JetBrains Mono", monospace;
    font-weight: 800;
    letter-spacing: 4px;
    font-size: 18px;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 55px);
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 10px;
    opacity: .7;
}

/* =========================
   PROGRESS
========================= */
.progress-area {
    margin-bottom: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    margin-bottom: 8px;
}

.progress-bar {
    height: 5px;
    background: rgba(255,255,255,.1);
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #fff1a3);
    transition: width .4s ease;
}

/* =========================
   QUIZ
========================= */
.quiz-card {
    background: rgba(7, 28, 57, .82);
    border: 1px solid rgba(255,215,0,.2);
    border-radius: 18px;
    padding: clamp(25px, 5vw, 50px);
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 0 30px rgba(255,255,255,.02);
    backdrop-filter: blur(10px);
}

.question-number {
    color: var(--gold);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    margin-bottom: 15px;
}

.question {
    font-size: clamp(21px, 4vw, 32px);
    line-height: 1.3;
    margin-bottom: 35px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.04);
    color: white;
    padding: 18px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    transition: .25s ease;
}

.answer:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    background: rgba(255,215,0,.08);
}

.answer.correct {
    background: rgba(33,208,122,.18);
    border-color: var(--green);
}

.answer.wrong {
    background: rgba(255,51,77,.18);
    border-color: var(--red);
}

/* =========================
   RESULTAT
========================= */
.result {
    display: none;
    text-align: center;
    background: rgba(7, 28, 57, .88);
    border: 1px solid rgba(255,215,0,.25);
    border-radius: 20px;
    padding: 45px 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.result-logo {
    color: var(--gold);
    font-family: "JetBrains Mono", monospace;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 20px;
}

.score {
    font-size: 40px;
    font-weight: 800;
}

/* =========================
   COOPERATION ROUGE
========================= */
.final-letter {
    display: none;
    margin: 20px auto 5px;
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(40px, 10vw, 80px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 6px;
    color: var(--red);

    text-shadow:
        0 0 10px rgba(255,51,77,.8),
        0 0 30px rgba(255,51,77,.55),
        0 0 70px rgba(255,51,77,.35);

    animation:
        revealCooperation .8s ease-out forwards,
        pulseCooperation 1.8s ease-in-out .8s infinite;
}

@keyframes revealCooperation {
    0% {
        opacity: 0;
        transform: scale(.5);
        filter: blur(15px);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes pulseCooperation {
    0%, 100% {
        text-shadow:
            0 0 10px rgba(255,51,77,.8),
            0 0 30px rgba(255,51,77,.55),
            0 0 70px rgba(255,51,77,.35);
    }

    50% {
        text-shadow:
            0 0 15px rgba(255,51,77,1),
            0 0 45px rgba(255,51,77,.75),
            0 0 90px rgba(255,51,77,.45);
    }
}

#resultTitle {
    font-size: 28px;
    margin: 20px 0 10px;
}

#resultText {
    opacity: .75;
    line-height: 1.6;
}

/* =========================
   BOUTON
========================= */
.restart {
    margin-top: 25px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    padding: 13px 25px;
    border-radius: 8px;
    font-family: "JetBrains Mono", monospace;
    cursor: pointer;
    transition: .25s;
}

.restart:hover {
    background: var(--gold);
    color: var(--blue);
}

/* =========================
   MOBILE
========================= */
@media (max-width: 600px) {

    .answers {
        grid-template-columns: 1fr;
    }

    .final-letter {
        font-size: clamp(30px, 9vw, 55px);
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">EUROPA // UNION EUROPÉENNE</div>
    <h1>Quiz Européen</h1>
    <div class="subtitle">
        Testez vos connaissances sur l'Union européenne
    </div>
</header>

<div class="progress-area">
    <div class="progress-info">
        <span id="questionCounter">QUESTION 1 / 15</span>
        <span id="scoreCounter">SCORE : 0</span>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<section class="quiz-card" id="quiz">

    <div class="question-number" id="questionNumber">
        QUESTION 01
    </div>

    <div class="question" id="question">
        La France est membre de l'Union européenne.
    </div>

    <div class="answers">
        <button class="answer" onclick="answer(true)">VRAI</button>
        <button class="answer" onclick="answer(false)">FAUX</button>
    </div>

</section>

<section class="result" id="result">

    <div class="result-logo">
        EUROPA // MISSION TERMINÉE
    </div>

    <div class="score">
        <span id="finalScore">0</span>/15
    </div>

    <!-- COOPERATION APPARAÎT ICI -->
    <div class="final-letter" id="finalLetter">
        COOPERATION
    </div>

    <h2 id="resultTitle">
        Analyse terminée
    </h2>

    <p id="resultText">
        Résultat...
    </p>

    <button class="restart" onclick="restartQuiz()">
        ↻ RECOMMENCER
    </button>

</section>

</div>

<script>

const questions = [
    {
        question: "La France est membre de l'Union européenne.",
        answer: true
    },
    {
        question: "L'euro est la monnaie officielle de tous les pays de l'Union européenne.",
        answer: false
    },
    {
        question: "Le Parlement européen est élu directement par les citoyens.",
        answer: true
    },
    {
        question: "Le siège principal de la Commission européenne se trouve à Bruxelles.",
        answer: true
    },
    {
        question: "La Suisse fait partie de l'Union européenne.",
        answer: false
    },
    {
        question: "L'Union européenne compte 27 États membres.",
        answer: true
    },
    {
        question: "Le drapeau européen comporte 12 étoiles.",
        answer: true
    },
    {
        question: "Le Royaume-Uni est toujours membre de l'Union européenne.",
        answer: false
    },
    {
        question: "Le Parlement européen siège notamment à Strasbourg.",
        answer: true
    },
    {
        question: "Tous les pays européens utilisent l'euro.",
        answer: false
    },
    {
        question: "La libre circulation des personnes est l'un des principes de l'Union européenne.",
        answer: true
    },
    {
        question: "L'Union européenne possède une armée unique.",
        answer: false
    },
    {
        question: "Le traité de Maastricht a contribué à créer l'Union européenne.",
        answer: true
    },
    {
        question: "La Belgique est membre fondateur de la construction européenne.",
        answer: true
    },
    {
        question: "La Journée de l'Europe est célébrée le 9 mai.",
        answer: true
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `QUESTION ${String(currentQuestion + 1).padStart(2, "0")}`;

    document.getElementById("questionCounter").textContent =
        `QUESTION ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("question").textContent = q.question;

    document.getElementById("scoreCounter").textContent =
        `SCORE : ${score}`;

    document.getElementById("progress").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => {
        button.classList.remove("correct", "wrong");
        button.disabled = false;
    });
}

function answer(choice) {

    if (answered) return;

    answered = true;

    const correctAnswer = questions[currentQuestion].answer;
    const buttons = document.querySelectorAll(".answer");

    const selectedButton =
        choice ? buttons[0] : buttons[1];

    if (choice === correctAnswer) {
        score++;
        selectedButton.classList.add("correct");
    } else {
        selectedButton.classList.add("wrong");
    }

    document.getElementById("scoreCounter").textContent =
        `SCORE : ${score}`;

    buttons.forEach(button => {
        button.disabled = true;
    });

    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }

    }, 700);
}

function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.querySelector(".progress-area").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent = score;

    /* AFFICHAGE DE COOPERATION */
    const finalLetter =
        document.getElementById("finalLetter");

    finalLetter.style.display = "block";

    const title =
        document.getElementById("resultTitle");

    const text =
        document.getElementById("resultText");

    if (score === 15) {

        title.textContent = "EXCELLENT — MISSION ACCOMPLIE";

        text.textContent =
            "Votre connaissance de l'Union européenne est remarquable.";

    } else if (score >= 12) {

        title.textContent = "TRÈS BON RÉSULTAT";

        text.textContent =
            "Vous maîtrisez très bien les principales notions européennes.";

    } else if (score >= 8) {

        title.textContent = "BON RÉSULTAT";

        text.textContent =
            "Vos connaissances européennes sont solides.";

    } else {

        title.textContent = "MISSION TERMINÉE";

        text.textContent =
            "Continuez à découvrir l'Union européenne et son fonctionnement.";
    }
}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.querySelector(".progress-area").style.display = "block";

    document.getElementById("finalLetter").style.display = "none";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
```
